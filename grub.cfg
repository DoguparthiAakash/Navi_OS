set timeout=3
set default=0

# Request a 1024x768 32-bit linear framebuffer from GRUB (VBE).
# This allows Navi OS to use graphical mode with the fb.nux driver.
set gfxmode=1024x768x32
set gfxpayload=keep

menuentry "Navi OS (Graphical)" {
    multiboot /boot/navi.bin
    module /boot/initrd.img
    boot
}

menuentry "Navi OS (Text Mode)" {
    set gfxpayload=text
    multiboot /boot/navi.bin
    module /boot/initrd.img
    boot
}

