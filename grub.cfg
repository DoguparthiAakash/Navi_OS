set timeout=5
set default=0

# ─── Navi OS Boot Menu ────────────────────────────────────────────────────────
# Select a resolution. The OS reads the framebuffer GRUB sets up.
# GRUB negotiates with VBE/VESA on your GPU.

# Default resolution stored so submenus can override it
set NAVI_RES=1024x768x32

menuentry "Navi OS  [1024x768 - default]" {
    set gfxmode=1024x768x32
    set gfxpayload=keep
    multiboot /boot/navi.bin
    module /boot/initrd.img
    boot
}

menuentry "Navi OS  [1280x720 HD]" {
    set gfxmode=1280x720x32
    set gfxpayload=keep
    multiboot /boot/navi.bin
    module /boot/initrd.img
    boot
}

menuentry "Navi OS  [1920x1080 Full HD]" {
    set gfxmode=1920x1080x32
    set gfxpayload=keep
    multiboot /boot/navi.bin
    module /boot/initrd.img
    boot
}

menuentry "Navi OS  [800x600 Safe Mode]" {
    set gfxmode=800x600x32
    set gfxpayload=keep
    multiboot /boot/navi.bin
    module /boot/initrd.img
    boot
}

menuentry "Navi OS  [Text Mode 80x25]" {
    set gfxpayload=text
    multiboot /boot/navi.bin
    module /boot/initrd.img
    boot
}
